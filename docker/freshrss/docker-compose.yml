services:
  freshrss:
    image: freshrss/freshrss:latest
    container_name: freshrss
    restart: unless-stopped

    environment:
      TZ: America/Toronto
      CRON_MIN: "7,37"

    volumes:
      - freshrss_data:/var/www/FreshRSS/data
      - freshrss_extensions:/var/www/FreshRSS/extensions

    ports:
      - "100.120.129.25:8086:80"

    healthcheck:
      test: ["CMD", "cli/health.php"]
      interval: 75s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  freshrss_data:
  freshrss_extensions:
