services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: filebrowser
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - /srv/media:/srv/media
      - filebrowser_db:/database
      - filebrowser_config:/config
    restart: unless-stopped

volumes:
  filebrowser_db:
  filebrowser_config:
