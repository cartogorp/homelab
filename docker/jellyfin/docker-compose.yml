services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8096:8096"
    volumes:
      - /srv/appdata/jellyfin:/config
      - /srv/media:/media
    environment:
      - TZ=UTC
    # safer defaults
    user: "1000:1000"
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "993"
      - "44"
    networks:
      - media-net

networks:
  media-net:
    external: true
