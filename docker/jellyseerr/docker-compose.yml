services:
  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr

    environment:
      TZ: America/Toronto

    ports:
      - "127.0.0.0:5055:5055"

    volumes:
      - /srv/appdata/jellyseerr:/app/config

    restart: unless-stopped

    networks:
      - media-net

networks:
  media-net:
    external: true
